
name: Production Monitor

'on':
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  monitor-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Đăng nhập Postman
        run: postman login --with-api-key "${{ secrets.POSTMAN_API_KEY }}"

      - name: Chạy kịch bản Monitor
        run: postman collection run "59052207-0e254692-4efd-4d71-9258-31816a2e4d9d"
